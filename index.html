      <script>
      // Right after a deploy an edge can briefly serve the new page with a bundle it
      // does not have yet; the module fails to load and the page stays blank. Refetch
      // the bundle past any cache and reload, at most twice a minute so a real outage
      // cannot loop.
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (!t || t.tagName !== 'SCRIPT' || t.type !== 'module') return;
        var now = Date.now(), tries = [];
        try { tries = JSON.parse(sessionStorage.getItem('vestlaunch.reloads') || '[]').filter(function (x) { return now - x < 60000; }); } catch (_) {}
        if (tries.length >= 2) return;
        try { sessionStorage.setItem('vestlaunch.reloads', JSON.stringify(tries.concat(now))); } catch (_) {}
        var done = function () { location.reload(); };
        try { fetch(t.src, { cache: 'reload' }).then(done, done); } catch (_) { setTimeout(done, 1200); }
      }, true);
    </script>
